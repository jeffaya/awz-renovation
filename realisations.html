<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réalisations | AWZ-Rénovation</title><meta name="description" content="Découvrez les réalisations AWZ-Rénovation : maçonnerie, pierre, tuffeau, dalles, façades et rénovation."><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{awz:'#14362e',sand:'#f4f0e7'}}}}</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="assets/css/styles.css"><link rel="icon" href="assets/images/favicon.svg"></head><body class="text-slate-800"><header class="sticky top-0 z-50 bg-white nav-shadow"><div class="mx-auto max-w-7xl px-4 h-20 flex items-center justify-between"><a href="index.html"><img src="assets/images/logo-awz.svg" class="h-14" alt="AWZ"></a><a href="index.html" class="btn-with-icon text-sm font-semibold"><i class="bi bi-arrow-left icon-inline" aria-hidden="true"></i> Retour à l’accueil</a></div></header><section class="bg-awz text-white py-20"><div class="mx-auto max-w-7xl px-4"><p class="text-xs uppercase tracking-[.3em] text-white/60">AWZ-Rénovation</p><h1 class="mt-3 font-serif-display text-5xl lg:text-6xl">Nos réalisations</h1><p class="mt-5 max-w-2xl text-white/75">Chaque chantier est unique. Filtrez les réalisations et faites glisser le curseur pour comparer les transformations.</p></div></section><main class="bg-sand py-16"><div class="mx-auto max-w-7xl px-4"><div class="flex flex-wrap gap-2"><button data-filter="all" class="rounded-full bg-awz text-white px-4 py-2 text-sm">Tous</button><button data-filter="maconnerie" class="rounded-full bg-white px-4 py-2 text-sm">Maçonnerie</button><button data-filter="pierre" class="rounded-full bg-white px-4 py-2 text-sm">Pierre & Tuffeau</button><button data-filter="exterieur" class="rounded-full bg-white px-4 py-2 text-sm">Extérieur</button></div><div class="mt-10 grid md:grid-cols-2 lg:grid-cols-3 gap-8">
<script>
const projects=[
['maconnerie','Rénovation complète','avant-maison.jpg','apres-maison.jpg'],
['pierre','Restauration de mur en pierre','avant-pierre.jpg','apres-pierre.jpg'],
['exterieur','Terrasse & aménagement','avant-terrasse.jpg','apres-terrasse.jpg'],
['maconnerie','Maçonnerie & rénovation','maconnerie.jpg','renovation-interieure.jpg'],
['pierre','Pierre & tuffeau','pierre-tuffeau.jpg','apres-pierre.jpg'],
['exterieur','Façade & extérieur','facade.jpg','maison-pierre.jpg']
];
document.write(projects.map((p,i)=>`<article data-project="${p[0]}" class="rounded-2xl bg-white p-4 shadow-sm"><div class="comparison h-72 rounded-xl bg-stone-200"><img src="assets/images/${p[2]}" class="h-full w-full object-cover" alt="Avant ${p[1]}"><div class="after"><img src="assets/images/${p[3]}" alt="Après ${p[1]}"></div><input type="range" min="0" max="100" value="50" aria-label="Comparer avant et après"><span class="label before-label">AVANT</span><span class="label after-label">APRÈS</span><span class="handle">↔</span></div><p class="mt-4 text-xs uppercase tracking-widest text-stone-500">${p[0]}</p><h2 class="mt-1 text-xl font-semibold">${p[1]}</h2><p class="mt-2 text-sm text-slate-600">Travaux réalisés avec soin, dans le respect du bâti et des finitions attendues.</p></article>`).join(''));
</script>
</div><div class="mt-16 rounded-3xl bg-awz p-8 lg:p-12 text-white flex flex-col lg:flex-row justify-between gap-8 items-start lg:items-center"><div><h2 class="font-serif-display text-4xl">Votre projet mérite le même soin.</h2><p class="mt-3 text-white/75">Expliquez-nous votre besoin et recevez un devis gratuit.</p></div><a href="contact.html" class="btn-with-icon rounded-xl bg-white px-6 py-3 font-semibold text-awz">Demander un devis <i class="bi bi-arrow-right icon-inline" aria-hidden="true"></i></a></div></div></main><script src="assets/js/app.js"></script></body></html>
