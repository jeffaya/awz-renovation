<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réalisations | AWZ-Rénovation</title><meta name="description" content="Découvrez les réalisations AWZ-Rénovation : maçonnerie, rénovation intérieure, pierre et tuffeau, façades, dalles et terrasses, pierre de taille et finitions."><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{awz:'#14362e',sand:'#f4f0e7'}}}}</script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="assets/css/styles.css"><link rel="icon" href="assets/images/favicon.svg"><meta property="og:title" content="Réalisations | AWZ-Rénovation"><meta property="og:description" content="Découvrez les avant/après des projets de rénovation et maçonnerie AWZ-Rénovation."><meta property="og:image" content="https://www.awz-renovation.fr/assets/images/apres-maconnerie-ouverture.webp"><script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"HomeAndConstructionBusiness",
  "name":"AWZ-Rénovation",
  "url":"https://www.awz-renovation.fr/",
  "telephone":"+33678816696",
  "email":"antonywouenzell@yahoo.fr",
  "address":{"@type":"PostalAddress","streetAddress":"2 rue du Gros Chillou","postalCode":"37420","addressLocality":"Avoine","addressCountry":"FR"},
  "areaServed":["Avoine","Chinon","Saumur","Langeais","Azay-le-Rideau","Richelieu","Loudun","Tours","Noyant"],
  "priceRange":"€€"
}</script></head><body class="text-slate-800"><header class="sticky top-0 z-50 bg-white nav-shadow"><div class="mx-auto max-w-7xl px-4 h-20 flex items-center justify-between"><a href="index.html"><img src="assets/images/logo-awz.svg" class="h-14" alt="AWZ"></a><a href="index.html" class="btn-with-icon text-sm font-semibold"><i class="bi bi-arrow-left icon-inline" aria-hidden="true"></i> Retour à l’accueil</a></div></header>
<section class="bg-awz text-white py-16 lg:py-20"><div class="mx-auto max-w-7xl px-4"><p class="text-xs uppercase tracking-[.3em] text-white/60">AWZ-Rénovation</p><h1 class="mt-3 font-serif-display text-5xl lg:text-6xl">Nos réalisations</h1><p class="mt-5 max-w-2xl text-white/75">Chaque chantier est unique. Découvrez nos avant / après par type de travaux et faites glisser le curseur pour comparer les transformations.</p></div></section>
<main class="bg-sand py-10 lg:py-16"><div class="mx-auto max-w-7xl px-4">
<div class="flex flex-wrap gap-2" id="project-filters"><button data-filter="all" class="filter-pill filter-active rounded-full px-4 py-2 text-sm">Tous</button><button data-filter="maconnerie" class="filter-pill rounded-full px-4 py-2 text-sm">Maçonnerie & gros œuvre</button><button data-filter="interieur" class="filter-pill rounded-full px-4 py-2 text-sm">Rénovation intérieure</button><button data-filter="pierre" class="filter-pill rounded-full px-4 py-2 text-sm">Pierre & Tuffeau</button><button data-filter="facades" class="filter-pill rounded-full px-4 py-2 text-sm">Façades</button><button data-filter="terrasses" class="filter-pill rounded-full px-4 py-2 text-sm">Dalles & Terrasses</button><button data-filter="finitions" class="filter-pill rounded-full px-4 py-2 text-sm">Pierre de taille & Finitions</button></div>

<section id="featured-project" class="featured-project mt-10"></section>
<section id="projects-grid" class="mt-8 grid md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8"></section>
</div></main>
<script>
const projects=[
{cat:'maconnerie',label:'Maçonnerie & gros œuvre',title:'Ouverture de mur porteur & reprise de maçonnerie',before:'avant-maconnerie-ouverture.jpg',after:'apres-maconnerie-ouverture.jpg',copy:'Création d’une grande ouverture dans un mur en pierre, renforcement de la structure et finitions soignées pour transformer l’espace tout en respectant le bâti existant.',points:['Ouverture et renforcement de mur porteur','Maçonnerie et finitions pierre','Sécurisation et respect du bâti']},
{cat:'interieur',label:'Rénovation intérieure',title:'Transformation complète d’une pièce',before:'avant-maison.jpg',after:'apres-maison.jpg',copy:'D’un espace brut à une pièce de vie lumineuse : reprise des murs, sols, éclairage et finitions pour obtenir un ensemble moderne et chaleureux.',points:['Reprise complète des supports','Sols, murs et finitions','Mise en valeur des volumes']},
{cat:'pierre',label:'Pierre & Tuffeau',title:'Restauration de façade en tuffeau',before:'avant-tuffeau-facade.jpg',after:'apres-tuffeau-facade.jpg',copy:'Nettoyage, reprise des pierres et rejointoiement pour retrouver une façade claire, régulière et fidèle au caractère du bâti ancien.',points:['Nettoyage et préparation de la pierre','Reprise des joints et pierres abîmées','Finition adaptée au tuffeau']},
{cat:'facades',label:'Façades',title:'Ravalement et remise en valeur de façade',before:'avant-facadegen-v10.jpg',after:'apres-facadegen-v10.jpg',copy:'Reprise du support, correction des défauts et finitions pour redonner à la façade un aspect propre, homogène et durable.',points:['Préparation et reprise des supports','Traitement des zones dégradées','Finition homogène et durable']},
{cat:'terrasses',label:'Dalles & Terrasses',title:'Création d’une terrasse et de ses abords',before:'avant-terrasse-v10.jpg',after:'apres-terrasse-v10.jpg',copy:'Préparation du terrain, création des surfaces et finitions pour structurer un véritable espace extérieur agréable et facile à vivre.',points:['Préparation et nivellement du terrain','Création de dalle et terrasse','Finitions des abords']},
{cat:'finitions',label:'Pierre de taille & Finitions',title:'Reconstruction d’un muret en pierre',before:'avant-muret-maconnerie.jpg',after:'apres-muret-maconnerie.jpg',copy:'Reprise des pierres, reconstruction et rejointoiement avec une finition adaptée au bâti ancien et au paysage existant.',points:['Tri et reprise des pierres','Reconstruction du muret','Rejointoiement et finitions']}
];
const featured=document.getElementById('featured-project');
const grid=document.getElementById('projects-grid');
function comparisonMarkup(p,height='h-80 lg:h-[470px]'){
 return `<div class="comparison ${height} rounded-2xl bg-stone-200"><img src="assets/images/${p.before}" class="h-full w-full object-cover" alt="Avant ${p.title}"><div class="after"><img src="assets/images/${p.after}" alt="Après ${p.title}"></div><input type="range" min="0" max="100" value="50" aria-label="Comparer avant et après"><span class="label before-label">AVANT</span><span class="label after-label">APRÈS</span><span class="handle"><i class="bi bi-arrow-left-right"></i></span></div>`;
}
function initComparisons(scope=document){scope.querySelectorAll('.comparison').forEach(c=>{const input=c.querySelector('input'),after=c.querySelector('.after'),handle=c.querySelector('.handle');if(!input)return;const update=()=>{after.style.width=input.value+'%';handle.style.left=input.value+'%';};input.addEventListener('input',update);update();});}
function renderFeatured(p){featured.innerHTML=`<article class="featured-shell"><div class="featured-media">${comparisonMarkup(p)}</div><div class="featured-copy"><p class="project-kicker">${p.label} · Secteur Avoine / Chinon / Saumur</p><h2 class="font-serif-display text-3xl lg:text-4xl text-slate-900">${p.title}</h2><div class="featured-rule"></div><p class="mt-5 text-slate-600 leading-7">${p.copy}</p><div class="mt-6 space-y-3">${p.points.map(x=>`<div class="feature-point"><span><i class="bi bi-check-lg"></i></span><p>${x}</p></div>`).join('')}</div><a href="contact.html" class="btn-with-icon mt-8 rounded-full bg-awz px-6 py-3.5 font-semibold text-white shadow-sm">Demander un devis <i class="bi bi-arrow-right icon-inline" aria-hidden="true"></i></a></div></article>`;initComparisons(featured);}
function renderCards(items,featuredCat){const cards=items.filter(p=>p.cat!==featuredCat);grid.innerHTML=cards.map(p=>`<article class="project-card rounded-2xl bg-white p-3.5 lg:p-4 shadow-sm">${comparisonMarkup(p,'h-64 lg:h-72')}<div class="px-1 pb-2"><p class="mt-4 text-xs uppercase tracking-[.18em] text-stone-500">${p.label}</p><h3 class="mt-1 font-serif-display text-2xl text-slate-900">${p.title}</h3><p class="mt-2 text-sm leading-6 text-slate-600">${p.copy}</p><a href="contact.html" class="project-quote-link mt-4">Demander un devis <i class="bi bi-arrow-right"></i></a></div></article>`).join('');initComparisons(grid);}
function render(filter='all'){const items=filter==='all'?projects:projects.filter(p=>p.cat===filter);const lead=items[0];renderFeatured(lead);renderCards(items,lead.cat);grid.classList.toggle('hidden',items.length<=1);}
document.querySelectorAll('#project-filters [data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('#project-filters [data-filter]').forEach(b=>b.classList.toggle('filter-active',b===btn));render(btn.dataset.filter);}));
render('all');
</script></body></html>
